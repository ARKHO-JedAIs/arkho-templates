# esbuild is Vite's bundler: its postinstall places the platform binary, so the
# build cannot run without it. pnpm 10+ does not run dependency build scripts
# unless they are approved, and pnpm 11 aborts the install with
# ERR_PNPM_IGNORED_BUILDS when one is left unapproved.
allowBuilds:
  esbuild: true
