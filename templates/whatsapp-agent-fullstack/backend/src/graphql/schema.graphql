# Realtime event channel the front subscribes to through aws-amplify.
#
# Nothing is stored here: the mutation runs on a NONE data source, so AppSync
# only forwards the published event to the clients subscribed to its id. The
# conversations themselves are persisted in DynamoDB by the WhatsApp functions.
#
# The backend publishes with IAM (common.whatsapp.realtime) and the front
# subscribes with its Cognito token, so a browser can listen but never emit.
# WhatsAppFactory replaces the `# subscribers` directive below: with the access
# module it becomes @aws_lambda (src/lambda/access/appsync-authorizer checks the
# `whatsapp` permission of the user's roles); without it, the admin group
# (WHATSAPP_ADMIN_GROUP) or any signed-in user.
#
# Channels: a contact's phone (its conversation) and "inbox" (the conversation
# list).

type Event @aws_iam @aws_cognito_user_pools {
  id: ID!
  type: String!
  message: String
  payload: AWSJSON
  timestamp: AWSDateTime!
}

type Mutation {
  publishEvent(id: ID!, type: String!, message: String, payload: AWSJSON): Event @aws_iam
}

type Subscription {
  onEvent(id: ID!): Event
    @aws_subscribe(mutations: ["publishEvent"])
    @aws_cognito_user_pools # subscribers
}

# GraphQL requires a query root type and this API only publishes, so the single
# query is a connectivity check.
type Query {
  ping: String! @aws_iam @aws_cognito_user_pools
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
