# yaml-language-server: $schema=https://unpkg.com/@jedais/arkho-cli/schema/arkho.template.schema.json

schemaVersion: 1
name: datalake-foundation
title: Datalake Foundation (AWS CDK)
description: >
  Infraestructura fundacional de un datalake en AWS con CDK (TypeScript).
  Incluye cuatro zonas S3 (raw, curated, analytics, archive) con ciclo de vida
  y cifrado. Módulos opcionales: Glue Data Catalog, Athena Workgroup,
  Lake Formation y VPC con endpoints privados.
version: 1.0.0
category: data
tags: [aws, cdk, typescript, datalake, s3, glue, athena, lake-formation]

parameters:
  - name: project_name
    type: string
    prompt: "Nombre del proyecto? (kebab-case; se usará como prefijo del stack CDK)"
    required: true
    pattern: "^[a-z][a-z0-9-]{1,40}$"
    patternHint: "letras minúsculas, números y guiones; debe empezar con letra (2-41 chars)"

  - name: environment
    type: choice
    prompt: "Entorno de despliegue?"
    default: dev
    choices:
      - { value: dev }
      - { value: staging }
      - { value: prod }

  - name: aws_region
    type: string
    prompt: "Región AWS donde se desplegará el datalake?"
    required: true
    pattern: "^[a-z]{2}-[a-z]+-[0-9]$"
    patternHint: "región AWS válida, ej. us-east-1"

  - name: aws_account_id
    type: string
    prompt: "ID de cuenta AWS (12 dígitos)?"
    required: true
    pattern: "^[0-9]{12}$"
    patternHint: "exactamente 12 dígitos numéricos"

  - name: bucket_prefix
    type: string
    prompt: "Prefijo para los buckets S3? (ej. my-company; se antepone a cada zona)"
    required: true
    pattern: "^[a-z][a-z0-9-]{1,30}$"
    patternHint: "letras minúsculas, números y guiones; 2-31 chars"

  - name: raw_retention_days
    type: integer
    prompt: "¿Cuántos días retener objetos en la zona raw (landing)?"
    default: 90
    min: 1
    max: 3650

  - name: archive_retention_years
    type: integer
    prompt: "¿Cuántos años retener objetos en la zona archive (Glacier)?"
    default: 7
    min: 1
    max: 99

  - name: admin_email
    type: string
    prompt: "Email del administrador (para alarmas CloudWatch)?"
    required: true
    pattern: "^[^@]+@[^@]+\\.[^@]+$"
    patternHint: "dirección de email válida, ej. ops@empresa.com"

  - name: enable_glue_catalog
    type: choice
    prompt: "¿Habilitar Glue Data Catalog (bases de datos y crawlers)?"
    default: "true"
    choices:
      - { value: "true", label: "Sí" }
      - { value: "false", label: "No" }

  - name: enable_athena
    type: choice
    prompt: "¿Habilitar Athena Workgroup para consultas ad-hoc?"
    default: "true"
    choices:
      - { value: "true", label: "Sí" }
      - { value: "false", label: "No" }

  - name: enable_lake_formation
    type: choice
    prompt: "¿Habilitar Lake Formation para control de acceso fino?"
    default: "false"
    choices:
      - { value: "true", label: "Sí" }
      - { value: "false", label: "No" }

  - name: enable_vpc
    type: choice
    prompt: "¿Habilitar VPC con subnets privadas y endpoints S3/Glue?"
    default: "false"
    choices:
      - { value: "true", label: "Sí" }
      - { value: "false", label: "No" }

  - name: vpc_cidr
    type: string
    prompt: "Bloque CIDR para la VPC?"
    required: false
    default: "10.0.0.0/16"
    pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    patternHint: "bloque CIDR válido, ej. 10.0.0.0/16"
    when: "enable_vpc == 'true'"

templating:
  engine: token

nextSteps:
  - "cd {{ project_name }}"
  - "npm install"
  - "npm run build"
  - "cdk bootstrap aws://{{ aws_account_id }}/{{ aws_region }}"
  - "cdk deploy {{ project_name }}-datalake-{{ environment }}"
