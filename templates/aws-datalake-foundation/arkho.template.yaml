# yaml-language-server: $schema=https://unpkg.com/@jedais/arkho-cli/schema/arkho.template.schema.json

schemaVersion: 1
name: aws-datalake-foundation
title: AWS Data Lake Foundation (CDK)
description: >
  Foundational AWS Data Lake on CDK v2 (TypeScript): 4 S3 zones (Raw/Clean/Curated
  with Iceberg/Archive in Glacier), Glue ETL orchestrated by Step Functions, native
  governance with Lake Formation + Glue Data Catalog, KMS encryption end-to-end,
  CloudTrail auditing, and configurable retention. Split into 7–8 stacks (security,
  storage, governance, ingestion, processing, consumption, observability, optional
  network) with per-environment config (dev/qa/stg/prod) that supports either one
  shared AWS account or one account per environment, cdk-nag and tests.
version: 2.0.0
category: datalake
tags: [aws, cdk, datalake, typescript, iac, glue, lakeformation, iceberg, vpc]

parameters:
  - name: project_slug
    type: string
    prompt: "Project slug? (prefix for all resources and the npm package name)"
    required: true
    pattern: "^[a-z][a-z0-9-]{1,30}$"
    patternHint: "lowercase letters, numbers and hyphens; must start with a letter (2-31 chars), e.g. acme-datalake"

  - name: client_name
    type: string
    prompt: "Client / organization display name? (used in descriptions and docs)"
    required: true
    minLength: 2
    maxLength: 60
    # Interpolated into single-quoted TypeScript string literals, so quotes and
    # backslashes would break the generated code.
    pattern: "^[^'\"\\\\`$]+$"
    patternHint: "any text without quotes, backticks, dollar signs or backslashes, e.g. Acme Corp"

  - name: environment
    type: choice
    prompt: "Default deployment environment?"
    default: dev
    choices:
      - { value: dev }
      - { value: qa }
      - { value: stg }
      - { value: prod }

  - name: aws_region
    type: string
    prompt: "Target AWS region?"
    description: >
      Asked once and applied to all four environments, but `region` stays a
      per-environment field in lib/config/environments.ts so you can move one
      environment to another region later by editing it.
    default: us-east-1
    pattern: "^[a-z]{2}-[a-z]+-[0-9]$"
    patternHint: "an AWS region such as us-east-1"

  # Must stay immediately before the account parameters: a `when` expression may
  # only reference parameters declared EARLIER than itself.
  - name: account_strategy
    type: choice
    prompt: "How are AWS accounts organized across the four environments?"
    default: shared
    choices:
      - value: shared
        label: "One shared account"
        hint: "dev, qa, stg and prod all deploy into the same AWS account"
      - value: per_environment
        label: "One account per environment"
        hint: "you will also be asked for the qa, stg and prod account IDs"

  - name: aws_account_id
    type: string
    prompt: "AWS account ID for `dev` (12 digits)?"
    description: >
      With one shared account every environment deploys here. With one account per
      environment this is dev's account, and the fallback for any environment left
      blank in lib/config/environments.ts.
    required: true
    pattern: "^[0-9]{12}$"
    patternHint: "exactly 12 numeric digits"

  # Only asked with `per_environment`. `default: ""` is REQUIRED, not cosmetic: a
  # parameter with no answer and no default renders the LITERAL `{{ token }}` into
  # the generated TypeScript. The empty string is the designed signal that
  # environments.ts coalesces against dev's account.
  - name: aws_account_id_qa
    type: string
    prompt: "AWS account ID for `qa` (12 digits)?"
    required: true
    default: ""
    pattern: "^([0-9]{12})?$"
    patternHint: "exactly 12 numeric digits"
    when: "account_strategy == 'per_environment'"

  - name: aws_account_id_stg
    type: string
    prompt: "AWS account ID for `stg` (12 digits)?"
    required: true
    default: ""
    pattern: "^([0-9]{12})?$"
    patternHint: "exactly 12 numeric digits"
    when: "account_strategy == 'per_environment'"

  - name: aws_account_id_prod
    type: string
    prompt: "AWS account ID for `prod` (12 digits)?"
    required: true
    default: ""
    pattern: "^([0-9]{12})?$"
    patternHint: "exactly 12 numeric digits"
    when: "account_strategy == 'per_environment'"

  - name: catalog_prefix
    type: string
    prompt: "Glue Data Catalog database prefix? (databases are named <prefix>_<env>_<zone>)"
    required: true
    pattern: "^[a-z][a-z0-9_]{0,20}$"
    patternHint: "lowercase letters, digits and underscores; must start with a letter (1-21 chars), e.g. acme"

  - name: admin_email
    type: string
    prompt: "Admin / alerts email address? (SNS subscription for operational alerts)"
    required: true
    pattern: "^[^@]+@[^@]+\\.[^@]+$"
    patternHint: "a valid email address, e.g. ops@empresa.com"

  - name: tag_owner
    type: string
    prompt: "Owner tag value? (team or organization accountable for these resources)"
    default: "arkho"
    # AWS tag values allow letters, digits, spaces and + - = . _ : / @ (max 256).
    # À-ɏ keeps accented letters, which AWS accepts (its own validation
    # is \p{L}) — the same range lib/config/tags.ts uses, so the manifest never
    # rejects something the generated code would happily accept.
    pattern: "^[A-Za-z0-9\\u00C0-\\u024F +=._:/@-]{1,256}$"
    patternHint: "letters (accents included), digits, spaces and + - = . _ : / @ (max 256), e.g. data-platform"

  # `default: ""` is REQUIRED: with no answer and no default the CLI renders the
  # literal `{{ extra_tags }}` into the generated TypeScript, which then becomes a
  # bogus tag. The empty string is handled explicitly by the parser.
  - name: extra_tags
    type: string
    prompt: "Extra tags mandated by the client? (comma-separated key=value, blank for none)"
    default: ""
    maxLength: 2048
    # Anchored because the CLI calls `new RegExp(pattern).test(value)` unanchored.
    # Key class omits `=` and `,` (the grammar's separators); the value class keeps
    # `=` because the parser splits on the FIRST `=`. Lengths encode the AWS
    # 128/256 limits. The `aws:` prefix is reserved by AWS, and is spelled out
    # case-by-case because the CLI compiles the pattern without the `i` flag.
    # Quotes/backticks/`$` are excluded for the same reason as client_name: the
    # value lands inside single-quoted TypeScript literals.
    pattern: "^(?![Aa][Ww][Ss]:)[A-Za-z0-9\\u00C0-\\u024F +._:/@-]{1,128}=[A-Za-z0-9\\u00C0-\\u024F +=._:/@-]{1,256}(,(?![Aa][Ww][Ss]:)[A-Za-z0-9\\u00C0-\\u024F +._:/@-]{1,128}=[A-Za-z0-9\\u00C0-\\u024F +=._:/@-]{1,256})*$"
    patternHint: "comma-separated key=value pairs, e.g. cost-center=1234,team=data (no 'aws:' prefix, no empty values; leave blank for none)"

  - name: raw_retention_days
    type: integer
    prompt: "Days before the Raw zone transitions to Glacier Instant Retrieval? (0 = no transition, keep in Standard)"
    default: 90
    minimum: 0
    maximum: 3650

  - name: archive_retention_years
    type: integer
    prompt: "Years to retain objects in the Archive zone before expiration? (0 = never expire, retain indefinitely)"
    default: 7
    minimum: 0
    maximum: 99

  - name: enable_object_lock
    type: choice
    prompt: "Enable S3 Object Lock (WORM) on the Archive and audit-trail buckets?"
    description: >
      Required if you claim regulatory retention. GOVERNANCE mode, so a principal with
      s3:BypassGovernanceRetention can still correct mistakes. The default retention rule
      is applied only in environments that do not auto-delete objects (i.e. not dev).
      IRREVERSIBLE: Object Lock can only be enabled when a bucket is created and can
      never be turned off.
    default: "true"
    choices:
      - { value: "true", label: "Yes" }
      - { value: "false", label: "No" }

  - name: quarantine_retention_days
    type: integer
    prompt: "Days to keep rejected records in the Quarantine zone?"
    description: >
      Rows that fail the data-quality gate are written to the Quarantine zone with the
      reason for rejection, instead of being silently dropped or crashing the job.
    default: 30
    minimum: 1
    maximum: 3650

  - name: quarantine_alarm_threshold
    type: integer
    prompt: "Rejected rows per pipeline run that should raise an alarm?"
    description: >
      Above this, the SNS alert fires. Without it the Quarantine zone is a pit nobody
      looks into.
    default: 100
    minimum: 1
    maximum: 10000000

  - name: iceberg_snapshot_retention_days
    type: integer
    prompt: "Days of Iceberg snapshot history to retain? (time-travel window)"
    description: >
      The weekly maintenance job expires snapshots older than this and compacts small
      files. Without maintenance an Iceberg table degrades: metadata grows without bound
      and queries slow down.
    default: 7
    minimum: 1
    maximum: 365

  - name: log_retention_days
    type: integer
    prompt: "CloudWatch log retention in days for the default environment?"
    description: >
      Applied per environment in lib/config/environments.ts (prod defaults higher).
      Must be a value CloudWatch accepts (1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180,
      365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653).
    default: 30
    minimum: 1
    maximum: 3653

  - name: analyst_principal_arn
    type: string
    prompt: "IAM principal ARN allowed to assume the analyst role? (blank = account root)"
    description: >
      The analyst role gets Lake Formation SELECT on non-PII data plus use of the Athena
      workgroup. Leave blank to trust the account root and restrict it later.
    default: ""
    pattern: "^(arn:aws[a-z-]*:iam::[0-9]{12}:(root|user/.+|role/.+))?$"
    patternHint: "an IAM user or role ARN, e.g. arn:aws:iam::123456789012:role/analysts (or blank)"

  - name: oidc_role_arn
    type: string
    prompt: "IAM role ARN for the GitHub Actions OIDC deploy role? (blank = CI runs read-only checks)"
    description: >
      Used by the generated .github/workflows/ci.yml. Blank still runs build, test and
      nag; cdk diff needs credentials so it is skipped without a role.
    default: ""
    pattern: "^(arn:aws[a-z-]*:iam::[0-9]{12}:role/.+)?$"
    patternHint: "an IAM role ARN, e.g. arn:aws:iam::123456789012:role/gha-deploy (or blank)"

  - name: lf_tag_domains
    type: string
    prompt: "Lake Formation 'dominio' tag values? (comma-separated business domains)"
    default: "marketing,operaciones,finanzas"
    pattern: "^[a-z0-9_-]+(,[a-z0-9_-]+)*$"
    patternHint: "comma-separated lowercase values, no spaces, e.g. ventas,riesgo,finanzas"

  - name: lf_tag_sensitivities
    type: string
    prompt: "Lake Formation 'sensibilidad' tag values? (comma-separated data classifications)"
    default: "pii,interno,publico"
    pattern: "^[a-z0-9_-]+(,[a-z0-9_-]+)*$"
    patternHint: "comma-separated lowercase values, no spaces, e.g. pii,interno,publico"

  - name: ingest_schedule
    type: string
    prompt: "EventBridge cron for the ingestion Lambdas? (UTC)"
    default: "cron(0 6 * * ? *)"
    pattern: "^cron\\(.+\\)$"
    patternHint: "an EventBridge cron expression in UTC, e.g. cron(0 6 * * ? *) for 06:00 UTC daily"

  - name: pipeline_schedule
    type: string
    prompt: "EventBridge cron for the Step Functions pipeline? (UTC, must run after ingestion)"
    default: "cron(0 7 * * ? *)"
    pattern: "^cron\\(.+\\)$"
    patternHint: "an EventBridge cron expression in UTC, e.g. cron(0 7 * * ? *)"

  - name: crawler_schedule
    type: string
    prompt: "EventBridge cron for the Glue crawlers? (UTC, must run after the pipeline finishes)"
    default: "cron(30 8 * * ? *)"
    pattern: "^cron\\(.+\\)$"
    patternHint: "an EventBridge cron expression in UTC, e.g. cron(30 8 * * ? *)"

  - name: package_manager
    type: choice
    prompt: "Which package manager will the project use?"
    default: pnpm
    choices: [{ value: npm }, { value: pnpm }, { value: yarn }]

  - name: enable_ingestion_lambdas
    type: choice
    prompt: "Enable ingestion Lambdas (GA4 Data API + Meta Ads + SFTP Connector)?"
    default: "true"
    choices:
      - { value: "true", label: "Yes" }
      - { value: "false", label: "No" }

  - name: enable_vpc
    type: choice
    prompt: "Enable VPC with private subnets and S3/Glue endpoints (network isolation)?"
    default: "false"
    choices:
      - { value: "true", label: "Yes" }
      - { value: "false", label: "No" }

  - name: vpc_cidr
    type: string
    prompt: "VPC CIDR block?"
    required: false
    default: "10.0.0.0/16"
    pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    patternHint: "a valid CIDR block, e.g. 10.0.0.0/16"
    when: "enable_vpc == 'true'"

templating:
  engine: token
  # No excludes needed: TypeScript uses ${...} and Python uses single braces,
  # so no source file carries a literal {{ }} token.

nextSteps:
  - "cd {{ project_slug }}"
  - "{{ package_manager }} install"
  - "{{ package_manager }} run build"
  - "{{ package_manager }} test"
  - "Bootstrap: npx cdk bootstrap aws://{{ aws_account_id }}/{{ aws_region }} — repeat it for every distinct `account` in lib/config/environments.ts (up to 4 with one account per environment)"
  - "Confirm the SNS alert subscription sent to {{ admin_email }}"
  - "AWS_PROFILE=<profile-for-that-account> {{ package_manager }} run deploy:{{ environment }}"
  - "Activate the new tag keys under Billing → Cost allocation tags (payer account, up to 24h to appear) or Cost Explorer cannot group by them"
