# yaml-language-server: $schema=https://unpkg.com/@jedais/arkho-cli/schema/arkho.template.schema.json

schemaVersion: 1
name: aws-datalake-foundation
title: AWS Data Lake Foundation (CDK)
description: >
  Foundational AWS Data Lake on CDK v2 (TypeScript): 5 S3 zones (Raw/Clean/Curated in
  Iceberg/Archive with Object Lock/Quarantine), a generic Glue ETL skeleton with a
  validation gate, Step Functions, enforced Lake Formation governance, KMS end-to-end
  and CloudTrail. Ingestion is a doorway, not an implementation: a Raw-zone writer role
  and a secret for the source database, no producers. 7-8 stacks, the environments you
  pick (dev/qa/stg/prod) in one AWS account or one each, cdk-nag and tests.
version: 2.0.0
category: datalake
tags: [aws, cdk, datalake, typescript, iac, glue, lakeformation, iceberg, vpc]

parameters:
  # Asked FIRST, and declared first on purpose: a `when` expression may only reference
  # parameters declared EARLIER than itself, and the per-environment account parameters
  # below gate on `'<env>' in environments`.
  - name: environments
    type: multichoice
    prompt: "Which environments will this project have?"
    description: >
      Pick only the ones you need — the generated project gets exactly these, and
      nothing assumes there are four. The order you click them in does not matter:
      lib/config/environments.ts sorts them canonically (dev, qa, stg, prod — least to
      most hardened) and the first one becomes the default target of `npm run
      synth`/`diff`/`deploy`. Adding one later means editing that file, not
      regenerating.
    # The only way to demand at least one: there is no minItems.
    required: true
    default: [dev, prod]
    choices:
      - value: dev
        hint: "buckets are destroyed by `cdk destroy`, smallest Glue workers"
      - value: qa
      - value: stg
      - value: prod
        hint: "termination protection, more Glue workers, 1 year of logs"

  - name: project_slug
    type: string
    prompt: "Project slug? (prefix for all resources and the npm package name)"
    required: true
    pattern: "^[a-z][a-z0-9-]{1,30}$"
    patternHint: "lowercase letters, numbers and hyphens; must start with a letter (2-31 chars), e.g. acme-datalake"

  - name: client_name
    type: string
    prompt: "Client / organization display name? (used in descriptions and docs)"
    required: true
    minLength: 2
    maxLength: 60
    # Interpolated into single-quoted TypeScript string literals, so quotes and
    # backslashes would break the generated code.
    pattern: "^[^'\"\\\\`$]+$"
    patternHint: "any text without quotes, backticks, dollar signs or backslashes, e.g. Acme Corp"

  - name: aws_region
    type: string
    prompt: "Target AWS region?"
    description: >
      Asked once and used to seed every environment, but `region` is spelled out in
      each environment's own block in lib/config/environments.ts, so moving one
      environment to another region is a one-line edit there.
    default: us-east-1
    pattern: "^[a-z]{2}-[a-z]+-[0-9]$"
    patternHint: "an AWS region such as us-east-1"

  # Must stay immediately before the account parameters: a `when` expression may
  # only reference parameters declared EARLIER than itself.
  - name: account_strategy
    type: choice
    prompt: "How are AWS accounts organized across your environments?"
    default: shared
    choices:
      - value: shared
        label: "One shared account"
        hint: "every environment you picked deploys into the same AWS account"
      - value: per_environment
        label: "One account per environment"
        hint: "you will be asked for one account ID per environment you picked"

  - name: aws_account_id
    type: string
    prompt: "Default AWS account ID (12 digits)?"
    description: >
      With one shared account every environment deploys here. With one account per
      environment this is the fallback for any environment whose `account` is left
      blank in lib/config/environments.ts.
    required: true
    pattern: "^[0-9]{12}$"
    patternHint: "exactly 12 numeric digits"

  # Only asked with `per_environment`, and only for the environments actually picked.
  # `default: ""` is REQUIRED, not cosmetic: a parameter with no answer and no default
  # renders the LITERAL `{{ token }}` into the generated TypeScript. The empty string
  # is the designed signal that environments.ts coalesces against `aws_account_id`.
  - name: aws_account_id_dev
    type: string
    prompt: "AWS account ID for `dev` (12 digits)?"
    required: true
    default: ""
    pattern: "^([0-9]{12})?$"
    patternHint: "exactly 12 numeric digits"
    when: "account_strategy == 'per_environment' && 'dev' in environments"

  - name: aws_account_id_qa
    type: string
    prompt: "AWS account ID for `qa` (12 digits)?"
    required: true
    default: ""
    pattern: "^([0-9]{12})?$"
    patternHint: "exactly 12 numeric digits"
    when: "account_strategy == 'per_environment' && 'qa' in environments"

  - name: aws_account_id_stg
    type: string
    prompt: "AWS account ID for `stg` (12 digits)?"
    required: true
    default: ""
    pattern: "^([0-9]{12})?$"
    patternHint: "exactly 12 numeric digits"
    when: "account_strategy == 'per_environment' && 'stg' in environments"

  - name: aws_account_id_prod
    type: string
    prompt: "AWS account ID for `prod` (12 digits)?"
    required: true
    default: ""
    pattern: "^([0-9]{12})?$"
    patternHint: "exactly 12 numeric digits"
    when: "account_strategy == 'per_environment' && 'prod' in environments"

  - name: catalog_prefix
    type: string
    prompt: "Glue Data Catalog database prefix? (databases are named <prefix>_<env>_<zone>)"
    required: true
    pattern: "^[a-z][a-z0-9_]{0,20}$"
    patternHint: "lowercase letters, digits and underscores; must start with a letter (1-21 chars), e.g. acme"

  - name: admin_email
    type: string
    prompt: "Admin / alerts email address? (SNS subscription for operational alerts)"
    required: true
    pattern: "^[^@]+@[^@]+\\.[^@]+$"
    patternHint: "a valid email address, e.g. ops@empresa.com"

  - name: tag_owner
    type: string
    prompt: "Owner tag value? (team or organization accountable for these resources)"
    default: "arkho"
    # AWS tag values allow letters, digits, spaces and + - = . _ : / @ (max 256).
    # À-ɏ keeps accented letters, which AWS accepts (its own validation
    # is \p{L}) — the same range lib/config/tags.ts uses, so the manifest never
    # rejects something the generated code would happily accept.
    pattern: "^[A-Za-z0-9\\u00C0-\\u024F +=._:/@-]{1,256}$"
    patternHint: "letters (accents included), digits, spaces and + - = . _ : / @ (max 256), e.g. data-platform"

  # `default: ""` is REQUIRED: with no answer and no default the CLI renders the
  # literal `{{ extra_tags }}` into the generated TypeScript, which then becomes a
  # bogus tag. The empty string is handled explicitly by the parser.
  - name: extra_tags
    type: string
    prompt: "Extra tags mandated by the client? (comma-separated key=value, blank for none)"
    default: ""
    maxLength: 2048
    # Anchored because the CLI calls `new RegExp(pattern).test(value)` unanchored.
    # Key class omits `=` and `,` (the grammar's separators); the value class keeps
    # `=` because the parser splits on the FIRST `=`. Lengths encode the AWS
    # 128/256 limits. The `aws:` prefix is reserved by AWS, and is spelled out
    # case-by-case because the CLI compiles the pattern without the `i` flag.
    # Quotes/backticks/`$` are excluded for the same reason as client_name: the
    # value lands inside single-quoted TypeScript literals.
    pattern: "^(?![Aa][Ww][Ss]:)[A-Za-z0-9\\u00C0-\\u024F +._:/@-]{1,128}=[A-Za-z0-9\\u00C0-\\u024F +=._:/@-]{1,256}(,(?![Aa][Ww][Ss]:)[A-Za-z0-9\\u00C0-\\u024F +._:/@-]{1,128}=[A-Za-z0-9\\u00C0-\\u024F +=._:/@-]{1,256})*$"
    patternHint: "comma-separated key=value pairs, e.g. cost-center=1234,team=data (no 'aws:' prefix, no empty values; leave blank for none)"

  - name: raw_retention_days
    type: integer
    prompt: "Days before the Raw zone transitions to Glacier Instant Retrieval? (0 = no transition, keep in Standard)"
    default: 90
    minimum: 0
    maximum: 3650

  - name: archive_retention_years
    type: integer
    prompt: "Years to retain objects in the Archive zone before expiration? (0 = never expire, retain indefinitely)"
    default: 7
    minimum: 0
    maximum: 99

  - name: enable_object_lock
    type: choice
    prompt: "Enable S3 Object Lock (WORM) on the Archive and audit-trail buckets?"
    description: >
      Required if you claim regulatory retention. GOVERNANCE mode, so a principal with
      s3:BypassGovernanceRetention can still correct mistakes. The default retention rule
      is applied only in environments that do not auto-delete objects, since a locked
      object cannot be emptied by `cdk destroy`.
      IRREVERSIBLE: Object Lock can only be enabled when a bucket is created and can
      never be turned off.
    default: "true"
    choices:
      - { value: "true", label: "Yes" }
      - { value: "false", label: "No" }

  - name: lf_tag_domains
    type: string
    prompt: "Lake Formation 'dominio' tag values? (comma-separated business domains)"
    description: >
      Placeholder taxonomy — replace with the client's real business domains. Purely
      descriptive: nothing in the template grants or denies access by domain.
    default: "general"
    pattern: "^[a-z0-9_-]+(,[a-z0-9_-]+)*$"
    patternHint: "comma-separated lowercase values, no spaces, e.g. ventas,riesgo,finanzas"

  - name: lf_tag_sensitivities
    type: string
    prompt: "Lake Formation 'sensibilidad' tag values, MOST RESTRICTIVE FIRST?"
    description: >
      THE ORDER IS A CONTRACT. The first value is treated as the most restrictive and
      the last as the most open: Raw, Clean and Quarantine are tagged with the first,
      Curated with the last, and the analyst role's grant EXCLUDES the first. Reversing
      the list would hand the analyst exactly the data you meant to protect.
    default: "confidencial,interno,publico"
    pattern: "^[a-z0-9_-]+(,[a-z0-9_-]+)*$"
    patternHint: "comma-separated lowercase values, no spaces, most restrictive first, e.g. pii,interno,publico"

  - name: pipeline_schedule
    type: string
    prompt: "EventBridge cron for the Step Functions pipeline? (UTC)"
    description: >
      Must run after whatever process lands data in the Raw zone — ingestion is not part
      of this template.
    default: "cron(0 7 * * ? *)"
    pattern: "^cron\\(.+\\)$"
    patternHint: "an EventBridge cron expression in UTC, e.g. cron(0 7 * * ? *)"

  - name: crawler_schedule
    type: string
    prompt: "EventBridge cron for the Glue crawlers? (UTC, must run after the pipeline finishes)"
    default: "cron(30 8 * * ? *)"
    pattern: "^cron\\(.+\\)$"
    patternHint: "an EventBridge cron expression in UTC, e.g. cron(30 8 * * ? *)"

  - name: package_manager
    type: choice
    prompt: "Which package manager will the project use?"
    default: pnpm
    choices: [{ value: npm }, { value: pnpm }, { value: yarn }]

  - name: enable_vpc
    type: choice
    prompt: "Enable VPC with private subnets and S3/Glue endpoints (network isolation)?"
    default: "false"
    choices:
      - { value: "true", label: "Yes" }
      - { value: "false", label: "No" }

  - name: vpc_cidr
    type: string
    prompt: "VPC CIDR block?"
    required: false
    default: "10.0.0.0/16"
    pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    patternHint: "a valid CIDR block, e.g. 10.0.0.0/16"
    when: "enable_vpc == 'true'"

templating:
  engine: token
  # No excludes needed. TypeScript uses ${...} and Python single braces, and the
  # GitHub Actions workflow only uses `${{ context.field }}` expressions — the CLI's
  # token regex is /\{\{\s*([\w_]+)\s*\}\}/ (word characters only), so anything with
  # a dot never matches.

nextSteps:
  - "cd {{ project_slug }}"
  - "{{ package_manager }} install"
  - "{{ package_manager }} run build"
  - "{{ package_manager }} test"
  - "Review lib/config/environments.ts: it holds one fully spelled-out block per environment ({{ environments }}) and every operational tunable lives there"
  - "Bootstrap: npx cdk bootstrap aws://{{ aws_account_id }}/{{ aws_region }} — repeat it once per DISTINCT `account` across your environment blocks"
  - "Confirm the SNS alert subscription sent to {{ admin_email }}"
  - "AWS_PROFILE=<profile-for-that-account> {{ package_manager }} run deploy — deploys the default environment; add `-- -c env=<name>` for any other"
  - "Load the source database credentials into the `{{ project_slug }}-<env>/source-db` secret"
  - "Point your ingestion process at the Raw zone: assume the `{{ project_slug }}-<env>-ingest-writer` role (the producer itself is NOT part of this template — see the README)"
  - "Register your sources and curated tables in the `{{ project_slug }}-<env>-job-config` DynamoDB table, then implement transform() and build_model() in glue/jobs/"
  - "Activate the new tag keys under Billing → Cost allocation tags (payer account, up to 24h to appear) or Cost Explorer cannot group by them"
